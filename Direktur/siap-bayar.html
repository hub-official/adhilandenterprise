<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<title>Siap Bayar — Adhiland ERP</title>
<script>
(function(){try{var t=localStorage.getItem('adh_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}
catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<div id="app"></div>
<script src="../assets/js/fmt.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/local-state.js"></script>
<script src="../assets/js/canonical-data.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  const F = fmt;
  const ROLE = 'Direktur';
  const LS = window.AdhLocalState;
  await AdhData.load();
  let statusFilter = 'disetujui'; // siap bayar default
  let roleFilter = 'semua';
  let selected = new Set();

  const ROLE_CHIPS = ['semua', 'Direktur', 'Teknik', 'Legal', 'Operasional', 'Marketing'];

  function normStatus(st) {
    return (st || '').toLowerCase().replace(/_/g, ' ').trim();
  }

  function statusBadge(st) {
    const s = normStatus(st);
    var cls = 'rag-neutral';
    if (s === 'disetujui') cls = 'rag-good';
    else if (s === 'dibayar') cls = 'rag-good';
    else if (s === 'ditolak' || s === 'dikembalikan') cls = 'rag-bad';
    else if (s.indexOf('menunggu') >= 0) cls = 'rag-warn';
    return '<span class="status-badge ' + cls + '">' + (st || '—') + '</span>';
  }

  function hasOverride(id) {
    const map = LS ? LS.getPengajuanMap() : {};
    return !!map[id] || !!map[String(id)];
  }

  function filterList() {
    var list = AdhData.PENGAJUAN || [];
    if (roleFilter && roleFilter !== 'semua') {
      var r = roleFilter.toLowerCase();
      list = list.filter(function (p) { return (p.sumberRole || '').toLowerCase() === r; });
    }
    var st = statusFilter.toLowerCase();
    if (st !== 'semua') {
      list = list.filter(function (p) { return normStatus(p.status) === st; });
    }
    return list;
  }

  function countByStatus(st) {
    return (AdhData.PENGAJUAN || []).filter(function (p) {
      return normStatus(p.status) === st;
    }).length;
  }

  function render() {
    var list = filterList();
    var nSiap = countByStatus('disetujui');
    var nDibayar = countByStatus('dibayar');
    var nilaiSiap = (AdhData.PENGAJUAN || []).filter(function (p) {
      return normStatus(p.status) === 'disetujui';
    }).reduce(function (s, p) { return s + (p.jumlah || 0); }, 0);
    var nilaiDibayar = (AdhData.PENGAJUAN || []).filter(function (p) {
      return normStatus(p.status) === 'dibayar';
    }).reduce(function (s, p) { return s + (p.jumlah || 0); }, 0);
    var kas = (AdhData.KAS && AdhData.KAS.total) || 0;
    var realisasi = (AdhData.BUDGET && AdhData.BUDGET.realisasi) || 0;

    var rows = list.map(function (p) {
      var canPay = normStatus(p.status) === 'disetujui';
      var chk = selected.has(p.id) ? 'checked' : '';
      var mockTag = (hasOverride(p.id) || p._mockCreated || p._paidAt)
        ? ' <span class="text-muted fs-10">(mock lokal)</span>' : '';
      var paidInfo = p._paidAt
        ? '<span class="text-muted fs-10">' + String(p._paidAt).slice(0, 16).replace('T', ' ') + '</span>'
        : '—';
      var actions = canPay
        ? '<button class="btn btn-primary btn-sm btn-pay" data-id="' + p.id + '">Tandai dibayar</button>'
        : '<span class="text-muted fs-11">—</span>';
      return '<tr>' +
        '<td>' + (canPay ? '<input type="checkbox" class="row-check" data-id="' + p.id + '" ' + chk + '>' : '') + '</td>' +
        '<td>' + p.id + '</td>' +
        '<td>' + (p.proyek || p.cluster || '—') + '</td>' +
        '<td>' + (p.jenis || '—') + '</td>' +
        '<td class="num">' + F.IDR(p.jumlah) + '</td>' +
        '<td>' + statusBadge(p.status) + mockTag + '</td>' +
        '<td class="text-muted fs-11">' + (p.sumberRole || '') + '</td>' +
        '<td>' + (p.rekening || '—') + '</td>' +
        '<td>' + paidInfo + '</td>' +
        '<td class="nowrap">' + actions + '</td>' +
        '</tr>';
    }).join('');

    var roleChipHtml = ROLE_CHIPS.map(function (r) {
      var label = r === 'semua' ? 'Semua' : r;
      return '<button class="chip ' + (roleFilter === r ? 'active' : '') + '" data-role="' + r + '">' + label + '</button>';
    }).join('');

    var content =
    '<div class="global-bar wrap gap-8">' +
      '<div class="filter-group" id="st-filters">' +
        '<span class="filter-label">Status</span>' +
        '<button class="chip ' + (statusFilter==='disetujui'?'active':'') + '" data-st="disetujui">Siap bayar (' + nSiap + ')</button>' +
        '<button class="chip ' + (statusFilter==='dibayar'?'active':'') + '" data-st="dibayar">Dibayar (' + nDibayar + ')</button>' +
        '<button class="chip ' + (statusFilter==='semua'?'active':'') + '" data-st="semua">Semua</button>' +
      '</div>' +
      '<div class="filter-group ml-auto gap-8">' +
        '<button class="btn btn-ghost btn-sm" id="btn-export-csv">Export CSV</button>' +
        '<button class="btn btn-primary btn-sm" id="btn-mass-pay" ' + (selected.size===0?'disabled':'') + '>Tandai dibayar massal (' + selected.size + ')</button>' +
      '</div>' +
    '</div>' +
    '<div class="global-bar pt-0">' +
      '<div class="filter-group" id="role-filters">' +
        '<span class="filter-label">Sumber role</span>' +
        roleChipHtml +
      '</div>' +
    '</div>' +
    '<p class="text-muted note-md">Setelah <strong>Disetujui</strong> Direktur, item masuk antrian bayar. <strong>Tandai dibayar</strong> = mock (sessionStorage) · kas &amp; realisasi budgeting disesuaikan di memori.</p>' +
    '<section class="kpi-grid cols-3">' +
      '<article class="kpi-card">' +
        '<div class="kpi-label">Siap bayar</div>' +
        '<div class="kpi-value">' + nSiap + '</div>' +
        '<div class="kpi-sub">' + F.IDR(nilaiSiap) + '</div>' +
      '</article>' +
      '<article class="kpi-card">' +
        '<div class="kpi-label">Sudah dibayar (mock)</div>' +
        '<div class="kpi-value">' + nDibayar + '</div>' +
        '<div class="kpi-sub">' + F.IDR(nilaiDibayar) + ' · realisasi ' + F.IDR(realisasi, 'compact') + '</div>' +
      '</article>' +
      '<article class="kpi-card">' +
        '<div class="kpi-label">Kas (setelah mock bayar)</div>' +
        '<div class="kpi-value">' + F.IDR(kas, 'compact') + '</div>' +
        '<div class="kpi-sub">Delta mock dari session</div>' +
      '</article>' +
    '</section>' +
    '<article class="card">' +
      '<div class="table-wrap"><table class="data-table">' +
        '<thead><tr><th></th><th>ID</th><th>Proyek</th><th>Jenis</th><th class="num">Nilai</th><th>Status</th><th>Role</th><th>Rekening</th><th>Dibayar pada</th><th>Aksi</th></tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="10" class="text-muted">Tidak ada item — setujui pengajuan di Persetujuan dulu</td></tr>') + '</tbody>' +
      '</table></div>' +
      '<p class="text-muted mt-2 fs-12">' + list.length + ' baris · tanpa integrasi bank · draft jurnal opsional di F5</p>' +
    '</article>';

    AdhShell.mount({ role: ROLE, title: 'Siap Bayar', content: content });

    document.querySelectorAll('#st-filters .chip').forEach(function (btn) {
      btn.addEventListener('click', function () { statusFilter = btn.dataset.st; selected.clear(); render(); });
    });
    document.querySelectorAll('#role-filters .chip').forEach(function (btn) {
      btn.addEventListener('click', function () { roleFilter = btn.dataset.role; selected.clear(); render(); });
    });
    document.querySelectorAll('.row-check').forEach(function (cb) {
      cb.addEventListener('change', function () {
        if (cb.checked) selected.add(cb.dataset.id); else selected.delete(cb.dataset.id);
        render();
      });
    });
    document.querySelectorAll('.btn-pay').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.dataset.id;
        AdhShell.confirmDialog({
          title: 'Tandai dibayar',
          message: 'Tandai ' + id + ' sebagai dibayar? Kas dan realisasi akan disesuaikan (mock lokal).',
          confirmText: 'Tandai dibayar',
          onConfirm: function () {
            LS.markPaid(id);
            selected.delete(id);
            LS.showToast('Dibayar (mock lokal): ' + id, 'info');
            render();
          }
        });
      });
    });
    document.getElementById('btn-mass-pay') && document.getElementById('btn-mass-pay').addEventListener('click', function () {
      if (selected.size === 0) return;
      var ids = Array.from(selected);
      AdhShell.confirmDialog({
        title: 'Bayar massal',
        message: 'Tandai ' + ids.length + ' item sebagai dibayar? Aksi ini disimpan sebagai mock lokal.',
        confirmText: 'Bayar ' + ids.length + ' item',
        onConfirm: function () {
          LS.markPaidBulk(ids);
          selected.clear();
          LS.showToast('Dibayar massal (mock lokal): ' + ids.length + ' item', 'info');
          render();
        }
      });
    });
    document.getElementById('btn-export-csv') && document.getElementById('btn-export-csv').addEventListener('click', function () {
      var rows = list.map(function (p) {
        return {
          id: p.id,
          status: p.status,
          proyek: p.proyek || p.cluster || '',
          jenis: p.jenis || '',
          jumlah: p.jumlah || 0,
          sumberRole: p.sumberRole || '',
          rekening: p.rekening || '',
          paidAt: p._paidAt || ''
        };
      });
      LS.exportCsv('siap-bayar-filter-' + new Date().toISOString().slice(0, 10) + '.csv', rows,
        ['id', 'status', 'proyek', 'jenis', 'jumlah', 'sumberRole', 'rekening', 'paidAt']);
    });
  }
  render();
});
</script>
</body>
</html>
