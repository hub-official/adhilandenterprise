<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buku Besar — Adhiland Finance</title>
<script>(function(){try{var t=localStorage.getItem('adh_theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<div id="app"></div>
<script src="../assets/js/fmt.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  const F = fmt;
  await AdhData.load();
  let page = 1;
  const size = 50;
  const report = await AdhData.loadReport('buku_besar');
  const allRows = report.rows || [];
  const akun = report.akun || [];
  const total = report.total || allRows.length;

  function render() {
    const pg = AdhData.paginate(allRows, page, size);
    const keys = allRows[0] ? Object.keys(allRows[0]) : [];
    const head = keys.slice(0, 8).map(k => `<th>${k}</th>`).join('');
    const rows = pg.rows.map(r => {
      const cells = keys.slice(0, 8).map(k => {
        const v = r[k];
        const n = Number(String(v).replace(/[^\d.-]/g,''));
        if (!isNaN(n) && String(v).match(/\d/) && Math.abs(n) >= 1000) return `<td class="num">${F.IDR(n,'compact')}</td>`;
        return `<td>${v||'—'}</td>`;
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    const content = `
    <div class="global-bar">
      <span class="filter-label">Buku Besar</span>
      <span class="text-muted" style="font-size:12px;margin-left:auto">${akun.length} akun · ${total.toLocaleString('id-ID')} baris mutasi</span>
    </div>
    <section class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
      <article class="kpi-card"><div class="kpi-label">Akun</div><div class="kpi-value">${akun.length}</div></article>
      <article class="kpi-card"><div class="kpi-label">Baris (sample load)</div><div class="kpi-value">${allRows.length.toLocaleString('id-ID')}</div><div class="kpi-sub">Total DB: ${total.toLocaleString('id-ID')}</div></article>
      <article class="kpi-card"><div class="kpi-label">Halaman</div><div class="kpi-value">${pg.page}/${pg.pages}</div></article>
    </section>
    <article class="card">
      <div class="table-wrap"><table class="data-table"><thead><tr>${head}</tr></thead><tbody>${rows||'<tr><td>Kosong</td></tr>'}</tbody></table></div>
      <div class="flex-between mt-3">
        <p class="text-muted" style="font-size:12px">Sumber: buku_besar.csv (sample 500 baris di JSON)</p>
        <div class="flex gap-2">
          <button class="btn btn-secondary btn-sm" id="prev" ${page<=1?'disabled':''}>← Prev</button>
          <button class="btn btn-secondary btn-sm" id="next" ${page>=pg.pages?'disabled':''}>Next →</button>
        </div>
      </div>
    </article>`;
    AdhShell.mount({ role: 'Direktur', title: 'Buku Besar', content });
    document.getElementById('prev')?.addEventListener('click', () => { page--; render(); });
    document.getElementById('next')?.addEventListener('click', () => { page++; render(); });
  }
  render();
});
</script>
</body>
</html>
