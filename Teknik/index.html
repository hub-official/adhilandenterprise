<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<title>Home Teknik — Adhiland ERP</title>
<script>
(function(){try{var t=localStorage.getItem('adh_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}
catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<div id="app"></div>
<script src="../assets/js/fmt.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/canonical-data.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  await AdhData.load();
  const D = AdhData, F = fmt;
  const K = D.KONSTRUKSI || {};

  // Risiko dari kavling: on progress rendah + ada target serah terima
  const now = new Date();
  const risk = (D.KAVLING || [])
    .filter(function (k) {
      const pct = Number(k.progresBangun) || 0;
      const st = (k.status || '').toLowerCase();
      if (st === 'belum' || st === 'deal') return false;
      return pct < 100 && pct >= 0;
    })
    .map(function (k) {
      let telat = 0;
      if (k.tglSerahTerima) {
        const t = new Date(k.tglSerahTerima);
        if (!isNaN(t) && t < now) telat = Math.round((now - t) / 86400000);
      }
      return { k: k, telat: telat, pct: Number(k.progresBangun) || 0 };
    })
    .filter(function (r) { return r.telat > 0 || r.pct < 50; })
    .sort(function (a, b) { return b.telat - a.telat || a.pct - b.pct; })
    .slice(0, 8);

  const riskRows = risk.length
    ? risk.map(function (r) {
        const k = r.k;
        const color = r.telat > 90 ? 'var(--danger)' : r.telat > 0 ? 'var(--warning)' : 'var(--text-muted)';
        return '<tr>' +
          '<td><a href="detail.html?id=' + k.id + '">' + (k.kavling || k.code || '#' + k.id) + '</a></td>' +
          '<td>' + (k.proyek || '—').replace('EazyKost ', '').replace(' Garden', '') + '</td>' +
          '<td class="num">' + r.pct.toFixed(0) + '%</td>' +
          '<td class="num" style="color:' + color + '">' + (r.telat > 0 ? r.telat : '—') + '</td>' +
          '<td>' + (k.kontraktor || '—') + '</td>' +
          '</tr>';
      }).join('')
    : '<tr><td colspan="5" class="text-muted">Tidak ada unit berisiko dari data kavling (progres &amp; tgl ST)</td></tr>';

  // Progres terbaru dari progres.json
  let progresRows = '';
  try {
    const pr = await D.loadReport('progres');
    const rows = Array.isArray(pr) ? pr : (pr.rows || []);
    progresRows = rows.slice(0, 8).map(function (r) {
      return '<tr><td>' + (r.Kavling || r.kavling || '—') + '</td><td>' + (r.Cluster || r.cluster || '—') +
        '</td><td class="num">' + (r.Persentase || r.persentase || '—') + '%</td><td>' + (r.Tanggal || r.tanggal || '—') +
        '</td><td>' + (r['Dicatat oleh'] || r.oleh || '—') + '</td></tr>';
    }).join('');
  } catch (e) { progresRows = ''; }

  // Distribusi progres unit (data nyata dari kavling.json) — pengganti kurva-S hardcoded
  const BANDS = [[0,20,'0–20%'],[20,40,'20–40%'],[40,60,'40–60%'],[60,80,'60–80%'],[80,100,'80–100%']];
  const activeUnits = (D.KAVLING || []).filter(function (k) {
    const st = (k.status || '').toLowerCase();
    return st !== 'belum' && st !== 'deal';
  });
  const bandCounts = BANDS.map(function (b) {
    return activeUnits.filter(function (k) {
      const p = Number(k.progresBangun) || 0;
      return p >= b[0] && (b[1] === 100 ? p <= 100 : p < b[1]);
    }).length;
  });
  const bandMax = Math.max(1, Math.max.apply(null, bandCounts));

  const content = `
    <div class="global-bar">
      <span class="filter-label">Home Teknik</span>
      <span class="text-muted fs-12 ml-auto">Data per ${F.dateTime(D.AS_OF)}</span>
    </div>

    <section class="kpi-grid">
      <article class="kpi-card">
        <div class="kpi-label">On Progress</div>
        <div class="kpi-value">${K.onProgress || 0}</div>
        <div class="kpi-sub">dari ${K.total || 0} unit</div>
      </article>
      <article class="kpi-card">
        <div class="kpi-label">Terlambat ST</div>
        <div class="kpi-value">${K.terlambat || 0}</div>
        <div class="kpi-sub">Rata-rata ${K.rataTelatHari || 0} hari</div>
      </article>
      <article class="kpi-card">
        <div class="kpi-label">Close</div>
        <div class="kpi-value">${K.close || 0}</div>
        <div class="kpi-sub">Serah terima selesai</div>
      </article>
      <article class="kpi-card">
        <div class="kpi-label">Serapan Konstruksi</div>
        <div class="kpi-value">${F.pct(D.BUDGET.konstruksiSerapan || 0)}</div>
        <div class="kpi-sub">${F.IDR(D.BUDGET.konstruksiRealisasi, 'compact')} / ${F.IDR(D.BUDGET.konstruksiAnggaran, 'compact')}</div>
      </article>
    </section>

    <div class="zone zone-2-6-6">
      <article class="card">
        <div class="card-header">
          <h3 class="card-title">Unit berisiko (progres rendah / lewat ST)</h3>
          <div class="card-actions"><a class="btn btn-ghost btn-sm" href="progres.html">Progres</a></div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Kavling</th><th>Proyek</th><th class="num">Progres</th><th class="num">Telat ST</th><th>Kontraktor</th></tr></thead>
            <tbody>${riskRows}</tbody>
          </table>
        </div>
        <p class="source-note">Sumber: kavling.json (progresBangun, tglSerahTerima)</p>
      </article>
      <article class="card">
        <div class="card-header">
          <h3 class="card-title">Distribusi progres unit</h3>
        </div>
        <div class="h-160 flex align-end gap-8 py-12">
          ${BANDS.map(function (b, i) {
            const n = bandCounts[i];
            const h = Math.round((n / bandMax) * 100);
            return '<div class="flex-1 flex flex-col align-center gap-4 h-full justify-end" title="' + b[2] + ': ' + n + ' unit">' +
              '<span class="text-muted fs-11">' + n + '</span>' +
              '<div style="width:100%;background:var(--viz-actual);height:' + Math.max(2, h) + '%;border-radius:3px 3px 0 0;opacity:.9"></div>' +
              '<span class="text-muted fs-10 nowrap">' + b[2] + '</span>' +
              '</div>';
          }).join('')}
        </div>
        <p class="source-note">Sumber: kavling.json (progresBangun) · ${activeUnits.length} unit aktif · belum ada time-series progres bulanan di data layer, sehingga kurva-S historis tidak ditampilkan.</p>
      </article>
    </div>

    <article class="card mt-4">
      <div class="card-header">
        <h3 class="card-title">Catatan progres terbaru</h3>
        <div class="card-actions"><a class="btn btn-ghost btn-sm" href="progres.html">Semua</a></div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Kavling</th><th>Cluster</th><th class="num">%</th><th>Tanggal</th><th>Oleh</th></tr></thead>
          <tbody>${progresRows || '<tr><td colspan="5" class="text-muted">Tidak ada data progres.json</td></tr>'}</tbody>
        </table>
      </div>
    </article>
  `;
  AdhShell.mount({ role: 'Teknik', title: 'Home Teknik', content });
});
</script>
</body>
</html>
