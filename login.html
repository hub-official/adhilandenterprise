<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<title>Masuk — Adhiland ERP</title>
<script>
(function(){try{var t=localStorage.getItem('adh_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}
catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="assets/img/Adhiland-transparent.png" alt="Adhiland" height="40">
    </div>
    <h1 class="login-title">Adhiland ERP</h1>
    <p class="login-version">Enterprise Version</p>
    <p class="login-sub">Pilih peran untuk masuk ke mockup interaktif</p>

    <div class="form-group">
      <label class="form-label">Peran</label>
      <div class="role-grid" id="role-grid">
        <button class="role-btn active" data-role="Direktur" type="button">Direktur</button>
        <button class="role-btn" data-role="Legal" type="button">Legal</button>
        <button class="role-btn" data-role="Teknik" type="button">Teknik</button>
        <button class="role-btn" data-role="Marketing" type="button">Marketing</button>
        <button class="role-btn" data-role="Operasional" type="button">Operasional</button>
        <button class="role-btn" data-role="Finance" type="button">Finance</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" id="email" type="email" inputmode="email" aria-required="true" value="direktur@adhiland.id" autocomplete="username" spellcheck="false">
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Kata sandi</label>
      <div class="input-affix">
        <input class="form-input" id="password" type="password" aria-required="true" value="••••••••" autocomplete="current-password">
        <button class="affix-btn" id="toggle-password" type="button" aria-label="Tampilkan kata sandi" aria-pressed="false" title="Tampilkan kata sandi">
          <svg class="ui-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="btn btn-primary btn-lg w-full"  id="btn-login" type="button">Masuk</button>
    <p class="mt-3 text-center mb-0"><a href="#" id="forgot-link" class="fs-12">Lupa kata sandi?</a></p>

    <p class="text-muted mt-4 fs-12 text-center">
      Interactive mockup | matalangit corp. | Sep-2026 | <span class="nowrap">Tema: <button id="theme-toggle" class="btn-icon inline-flex align-middle"  type="button"><svg class="ui-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 14.6A8.5 8.5 0 0 1 9.4 3.2 8.5 8.5 0 1 0 20.8 14.6Z"/></svg></button></span>
    </p>
  </div>
</div>

<script src="assets/js/theme.js"></script>
<script>
(function () {
  let selected = 'Direktur';
  const routes = {
    Direktur: 'Direktur/index.html',
    Legal: 'Legal/index.html',
    Teknik: 'Teknik/index.html',
    Marketing: 'Marketing/index.html',
    Operasional: 'Operasional/index.html',
    Finance: 'Finance/index.html'
  };

  /* Lightweight inline toast (login page does not load shell.js) */
  var toastHost = null;
  function showToast(msg, kind) {
    if (!toastHost) {
      toastHost = document.createElement('div');
      toastHost.className = 'toast-host';
      toastHost.setAttribute('role', 'status');
      toastHost.setAttribute('aria-live', 'polite');
      toastHost.setAttribute('aria-atomic', 'true');
      document.body.appendChild(toastHost);
    }
    var el = document.createElement('div');
    el.className = 'toast toast-' + (kind || 'info');
    el.textContent = msg;
    toastHost.appendChild(el);
    setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; setTimeout(function () { el.remove(); }, 280); }, 3200);
  }

  var emailEl = document.getElementById('email');
  var passEl = document.getElementById('password');
  function setInvalid(el, on) {
    if (on) el.setAttribute('aria-invalid', 'true');
    else el.removeAttribute('aria-invalid');
  }
  [emailEl, passEl].forEach(function (el) {
    el.addEventListener('input', function () { setInvalid(el, false); });
  });

  document.querySelectorAll('.role-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selected = btn.dataset.role;
      document.getElementById('email').value = selected.toLowerCase() + '@adhiland.id';
      setInvalid(emailEl, false);
    });
  });

  document.getElementById('btn-login').addEventListener('click', function () {
    var btn = this;
    if (btn.disabled) return;
    var emailOk = !!(emailEl.value || '').trim() && /.+@.+\..+/.test(emailEl.value.trim());
    var passOk = !!(passEl.value || '').trim();
    setInvalid(emailEl, !emailOk);
    setInvalid(passEl, !passOk);
    if (!emailOk || !passOk) {
      showToast(!emailOk ? 'Email tidak valid — periksa kembali.' : 'Kata sandi wajib diisi.', 'warn');
      (!emailOk ? emailEl : passEl).focus();
      return;
    }
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span> Memuat…';
    setTimeout(function () { window.location.href = routes[selected] || routes.Direktur; }, 450);
  });

  passEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-login').click();
  });

  var pwToggle = document.getElementById('toggle-password');
  if (pwToggle) pwToggle.addEventListener('click', function () {
    var inp = document.getElementById('password');
    var show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    this.setAttribute('aria-pressed', show ? 'true' : 'false');
    this.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
    this.title = show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi';
    inp.focus();
  });

  var forgot = document.getElementById('forgot-link');
  if (forgot) forgot.addEventListener('click', function (e) {
    e.preventDefault();
    showToast('Hubungi admin untuk reset kata sandi.', 'info');
  });
})();
</script>
</body>
</html>
